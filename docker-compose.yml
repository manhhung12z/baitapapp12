services:
  web:
    image: my-web-app:latest
    ports:
      - "80:80"
    environment:
      - ENV=production
    volumes:
      - ./web:/usr/src/app
    depends_on:
      - db

  db:
    image: mysql:latest
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: mydatabase
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql